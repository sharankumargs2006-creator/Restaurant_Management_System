<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <h2>Admin Login</h2>

    <form onsubmit="login(); return false;">

        <label>Username</label><br>
        <input type="text" id="username" placeholder="Enter Username" required><br><br>

        <label>Password</label><br>
        <input type="password" id="password" placeholder="Enter Password" required><br><br>

       <button type="button" onclick="login()">Login</button>

    </form>

</div>

<script>

function login(){

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    const savedUser = JSON.parse(localStorage.getItem("user"));

    if(savedUser && username === savedUser.email && password === savedUser.password){

        localStorage.setItem("login", "true");

        alert("Login Successful");

        window.location.href = "menu.html";

    }else{

        alert("Invalid Email or Password");
    }

}

</script>
</body>
</html>
