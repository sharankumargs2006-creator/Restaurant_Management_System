    <input type="text" id="customerName" placeholder="Enter Customer Name">

  <table id="cartTable">

    <tr>
        <th>Food Item</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Action</th>   
    </tr>

</table>
    <h3 id="totalAmount">Grand Total: ₹0</h3>

    <button onclick="checkout()">Proceed to Checkout</button>

<br><br>

<button onclick="clearCart()">🗑️ Clear Cart</button>

<script>

function clearCart(){

    localStorage.removeItem("cart");

```html
<script>

// Load cart
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let table = document.getElementById("cartTable");

// Show cart items
function renderCart(){

    table.innerHTML = `
        <tr>
            <th>Food Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
    `;

    let grandTotal = 0;

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.quantity;

        let row = table.insertRow();

        row.insertCell(0).innerText = item.name;
        row.insertCell(1).innerText = "₹" + item.price;

        // Quantity input
        let qtyCell = row.insertCell(2);

        qtyCell.innerHTML =
            `<input type="number" min="1" value="${item.quantity}"
             id="qty${index}" style="width:60px;"
             onchange="updateQuantity(${index})">`;

        // Item total
        row.insertCell(3).innerText = "₹" + itemTotal;

        // Remove button
        row.insertCell(4).innerHTML =
            `<button onclick="removeItem(${index})">Remove</button>`;

        grandTotal += itemTotal;
    });

    document.getElementById("totalAmount").innerText =
        "Grand Total: ₹" + grandTotal;

    localStorage.setItem("cart", JSON.stringify(cart));
}

// Update quantity
function updateQuantity(index){

    let qty = parseInt(document.getElementById("qty" + index).value);

    if(qty < 1){
        qty = 1;
    }

    cart[index].quantity = qty;

    renderCart();
}

// Remove item
function removeItem(index){

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    renderCart();
}

// Checkout
function checkout(){

    let name = document.getElementById("customerName").value.trim();

    if(name === ""){

        alert("Please enter customer name");

        return;
    }

    if(cart.length === 0){

        alert("Cart is empty");

        return;
    }

    localStorage.setItem("customerName", name);

    localStorage.setItem("finalCart", JSON.stringify(cart));

    window.location.href = "bill.html";
}

// First load
renderCart();

</script>
