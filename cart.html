```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bill-container">

    <h2>🛒 Your Cart</h2>

    <label>Customer Name</label>
    <input type="text" id="customerName" placeholder="Enter Customer Name">

    <table id="cartTable">

        <tr>
            <th>Food Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>

    </table>

    <h3 id="totalAmount">Grand Total: ₹0</h3>

    <button onclick="checkout()">Proceed to Checkout</button>

</div>

<script>

// Load cart
let cart = JSON.parse(localStorage.getItem("cart")) || [];

let table = document.getElementById("cartTable");

function renderCart(){

    table.innerHTML = `
        <tr>
            <th>Food Item</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>
    `;

    let grandTotal = 0;

    cart.forEach((item, index) => {

        let itemTotal = item.price * item.quantity;

        let row = table.insertRow();

        row.insertCell(0).innerText = item.name;
        row.insertCell(1).innerText = "₹" + item.price;

        let qtyCell = row.insertCell(2);

        qtyCell.innerHTML =
            `<input type="number" min="1" value="${item.quantity}" id="qty${index}" style="width:60px;" onchange="updateQuantity(${index})">`;

        row.insertCell(3).innerText = "₹" + itemTotal;

        grandTotal += itemTotal;
    });

    document.getElementById("totalAmount").innerText =
        "Grand Total: ₹" + grandTotal;

    localStorage.setItem("cart", JSON.stringify(cart));
}

function updateQuantity(index){

    let qty = parseInt(document.getElementById("qty" + index).value);

    if(qty < 1){
        qty = 1;
    }

    cart[index].quantity = qty;

    renderCart();
}

function checkout(){

    let name = document.getElementById("customerName").value.trim();

    if(name === ""){

        alert("Please enter customer name");

        return;
    }

    if(cart.length === 0){

        alert("Cart is empty");

        return;
    }

    // Save customer name
    localStorage.setItem("customerName", name);

    // Save final cart
    localStorage.setItem("finalCart", JSON.stringify(cart));

    // Open bill page
    window.location.href = "bill.html";
}

// First load
renderCart();

</script>

</body>
</html>
