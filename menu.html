<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>

if(localStorage.getItem("login") != "true"){

    alert("Please Login First");

    window.location.href = "login.html";

}

</script>

<header>
    <h1> Sri Anapurneshwri Management System</h1>
</header>

<div class="menu-container">

    <h2>Food Menu</h2>

    <table>

  <tr>
    <td><img src="veg-biryani.jpg" class="food-img"></td>
    <td>Veg Biryani</td>
    <td>₹150</td>
    <td><button onclick="orderFood('Veg Biryani',150)">Order</button></td>
</tr>

<tr>
    <td><img src="masala-dosa.jpg" class="food-img"></td>
    <td>Masala Dosa</td>
    <td>₹80</td>
    <td><button onclick="orderFood('Masala Dosa',80)">Order</button></td>
</tr>

<tr>
    <td><img src="paneer-pizza.jpg" class="food-img"></td>
    <td>Paneer Pizza</td>
    <td>₹250</td>
    <td><button onclick="orderFood('Paneer Pizza',250)">Order</button></td>
</tr>

<tr>
    <td><img src="burger.jpg" class="food-img"></td>
    <td>Burger</td>
    <td>₹120</td>
    <td><button onclick="orderFood('Burger',120)">Order</button></td>
</tr>

<tr>
    <td><img src="cold-drink.jpg" class="food-img"></td>
    <td>Cold Drink</td>
    <td>₹40</td>
    <td><button onclick="orderFood('Cold Drink',40)">Order</button></td>
</tr>
    </table>

</div>

<script>

function orderFood(name, price){

    localStorage.setItem("foodName", name);
    localStorage.setItem("foodPrice", price);

    window.location.href = "order.html";
}

</script>
<script>

<script>
function logout(){
    localStorage.removeItem("login");
    window.location.href = "index.html";
}
</script>

</body>
</html>
