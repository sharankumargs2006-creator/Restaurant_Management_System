<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bill-container" id="billArea">

    <h2>🧾 Bill Receipt</h2>

    <p><strong>Restaurant:</strong> Sri Anapurneshwari Restaurant</p>

    <!-- Customer Name Show Here -->
    <p><strong>Customer Name:</strong>
        <span id="custName"></span>
    </p>

    <hr>

    <table id="billTable">

        <tr>
            <th>Food Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
        </tr>

    </table>

    <h3 id="totalBill">Grand Total: ₹0</h3>

    <hr>

    <p>Thank you for visiting our restaurant 🍽️</p>

    <button onclick="window.print()">🖨️ Print / Save PDF</button>

    <button onclick="goHome()">🏠 Back to Home</button>

</div>

<script>

// Customer Name
let customerName = localStorage.getItem("customerName");

document.getElementById("custName").innerText =
    customerName || "Guest";

// Cart Data
let cart = JSON.parse(localStorage.getItem("finalCart")) || [];

let table = document.getElementById("billTable");

let grandTotal = 0;

// Remove old rows except header
table.innerHTML = `
    <tr>
        <th>Food Item</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
    </tr>
`;

cart.forEach(item => {

    // If quantity missing, set 1
    let qty = item.quantity ? parseInt(item.quantity) : 1;

    let price = parseFloat(item.price);

    let itemTotal = qty * price;

    let row = table.insertRow();

    row.insertCell(0).innerText = item.name;
    row.insertCell(1).innerText = qty;
    row.insertCell(2).innerText = "₹" + price;
    row.insertCell(3).innerText = "₹" + itemTotal;

    grandTotal += itemTotal;
});

// Show Grand Total
document.getElementById("totalBill").innerText =
    "Grand Total: ₹" + grandTotal;

// Back Home
function goHome(){

    localStorage.removeItem("cart");
    localStorage.removeItem("finalCart");
    localStorage.removeItem("customerName");

    window.location.href = "index.html";
}

</script>

</body>
</html>
