```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bill-container" id="billArea">

    <h2>🧾 Bill Receipt</h2>

    <p><strong>Restaurant:</strong> Sri Anapurneshwari Restaurant</p>

    <p><strong>Customer Name:</strong> <span id="custName"></span></p>

    <hr>

    <table id="billTable">

        <tr>
            <th>Food Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
        </tr>

    </table>

    <h3 id="totalBill">Grand Total: ₹0</h3>

    <hr>

    <p>Thank you for visiting our restaurant 🍽️</p>

    <button onclick="window.print()">🖨️ Print / Save PDF</button>

    <button onclick="goHome()">🏠 Back to Home</button>

</div>

<script>

let customerName = localStorage.getItem("customerName") || "Guest";

document.getElementById("custName").innerText = customerName;

let cart = JSON.parse(localStorage.getItem("finalCart")) || [];

let table = document.getElementById("billTable");

let grandTotal = 0;

cart.forEach(item => {

    let itemTotal = item.price * item.quantity;

    let row = table.insertRow();

    row.insertCell(0).innerText = item.name;
    row.insertCell(1).innerText = item.quantity;
    row.insertCell(2).innerText = "₹" + item.price;
    row.insertCell(3).innerText = "₹" + itemTotal;

    grandTotal += itemTotal;
});

document.getElementById("totalBill").innerText =
    "Grand Total: ₹" + grandTotal;

function goHome(){

    localStorage.removeItem("cart");
    localStorage.removeItem("finalCart");

    window.location.href = "index.html";
}

</script>

</body>
</html>
