```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Receipt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bill-container" id="billArea">

    <h2>🧾 Bill Receipt</h2>

    <p><strong>Restaurant:</strong> Sri Anapurneshwari Restaurant</p>

    <hr>

    <table id="billTable">

        <tr>
            <th>Food Item</th>
            <th>Price</th>
        </tr>

    </table>

    <h3 id="totalBill">Total: ₹0</h3>

    <hr>

    <p>Thank you for visiting our restaurant 🍽️</p>

    <button onclick="printBill()">🖨️ Print / Save PDF</button>

    <button onclick="goHome()">🏠 Back to Home</button>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let table = document.getElementById("billTable");
let total = 0;

cart.forEach(item => {

    let row = table.insertRow();

    row.insertCell(0).innerText = item.name;
    row.insertCell(1).innerText = "₹" + item.price;

    total += item.price;
});

document.getElementById("totalBill").innerText = "Total: ₹" + total;

function printBill(){
    window.print();
}

function goHome(){

    localStorage.removeItem("cart");

    window.location.href = "index.html";
}

</script>

</body>
</html>
