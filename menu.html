<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<script>

function addToCart(name, price){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.push({
        name: name,
        price: price
    });

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(name + " added to cart");
}

function openCart(){
    window.location.href = "cart.html";
}

</script>

<header>
    <h1> Sri Anapurneshwri Management System</h1>
</header>

<div class="menu-container">

    <h2>Food Menu</h2>

    <table>
      

  <tr>
    <td><img src="veg-biryani.jpg" class="food-img"></td>
    <td>Veg Biryani</td>
    <td>₹150</td>
<button onclick="addToCart('Veg Biryani',150)">Add to Cart</button>
</tr>

<tr>
    <td><img src="masala-dosa.jpg" class="food-img"></td>
    <td>Masala Dosa</td>
    <td>₹80</td>
<button onclick="addToCart('Masal Dosa',80)">Add to Cart</button>
</tr>

<tr>
    <td><img src="paneer-pizza.jpg" class="food-img"></td>
    <td>Paneer Pizza</td>
    <td>₹250</td>
    <button onclick="addToCart('Paneer pizza',250)">Add to Cart</button>
</tr>

<tr>
    <td><img src="burger.jpg" class="food-img"></td>
    <td>Burger</td>
    <td>₹120</td>
<button onclick="addToCart('Burger',120)">Add to Cart</button>
</tr>

<tr>
    <td><img src="cold-drink.jpg" class="food-img"></td>
    <td>Cold Drink</td>
    <td>₹40</td>
    <button onclick="addToCart('Cold Drinks',40)">Add to Cart</button>
</tr>
    </table>

</div>

<script>

function orderFood(name, price){

    localStorage.setItem("foodName", name);
    localStorage.setItem("foodPrice", price);

    window.location.href = "order.html";
}

</script>
<script>

<script>
function logout(){
    localStorage.removeItem("login");
    window.location.href = "index.html";
}
</script>

</body>
</html>
